<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="wallet-flow-title wallet-flow-desc">
<title id="wallet-flow-title">Fluxo técnico da Wallet API</title><desc id="wallet-flow-desc">A requisição exige Idempotency-Key. Uma chave já usada devolve a transferência original, ou 409 se os dados forem diferentes. Uma chave nova inicia uma transação: as carteiras são bloqueadas pelo menor ID e a chave é conferida de novo, então as regras e os saldos são processados e o autorizador HTTP é chamado ainda com os locks mantidos. Depois da autorização, a transferência com notificação pendente é salva e a transação é confirmada. Um agendador busca pendências com SKIP LOCKED, chama o notificador e registra SENT, nova tentativa ou FAILED ao atingir o limite.</desc>
<defs>
  <marker id="wallet-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker>
  <marker id="wallet-flow-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5d6ff"/></marker>
  <style>
    .box { fill: #151b22; stroke: #3a4653; stroke-width: 2; rx: 12; }
    .strong { fill: #0f1d2e; stroke: #58a6ff; }
    .text { fill: #f5f7fa; font: 600 16px Arial, sans-serif; text-anchor: middle; }
    .small { fill: #a9b2bd; font: 13px Arial, sans-serif; text-anchor: middle; }
    .label { fill: #a5d6ff; font: 600 12px Arial, sans-serif; }
    .line { fill: none; stroke: #58a6ff; stroke-width: 2.5; marker-end: url(#wallet-flow-arrow); }
    .branch { fill: none; stroke: #a5d6ff; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#wallet-flow-blue-arrow); }
  </style>
</defs>
<text class="label" x="30" y="31">01  TRANSFERÊNCIA · UMA TRANSAÇÃO</text>
<rect class="box" x="30" y="55" width="135" height="78"/><text class="text" x="97.5" y="87">POST /transfer</text><text class="small" x="97.5" y="111">Idempotency-Key</text>
<rect class="box" x="195" y="55" width="155" height="78"/><text class="text" x="272.5" y="87">Chave já usada?</text><text class="small" x="272.5" y="111">replay ou 409</text>
<rect class="box strong" x="380" y="55" width="170" height="78"/><text class="text" x="465" y="87">Transação + locks</text><text class="small" x="465" y="111">menor ID + rechecagem</text>
<rect class="box" x="580" y="55" width="150" height="78"/><text class="text" x="655" y="87">Regras + saldos</text><text class="small" x="655" y="111">débito e crédito</text>
<path class="line" d="M165 94 H185"/>
<path class="line" d="M350 94 H370"/>
<text class="label" x="365" y="150" text-anchor="middle">chave nova</text>
<path class="line" d="M550 94 H570"/>
<rect class="box" x="520" y="185" width="210" height="80"/><text class="text" x="625" y="217">Autorizador HTTP</text><text class="small" x="625" y="241">locks ainda mantidos</text>
<rect class="box" x="285" y="185" width="190" height="80"/><text class="text" x="380" y="217">Salvar transferência</text><text class="small" x="380" y="241">notificação pendente</text>
<rect class="box strong" x="30" y="185" width="210" height="80"/><text class="text" x="135" y="217">COMMIT · PostgreSQL</text><text class="small" x="135" y="241">saldos + transferência</text>
<path class="line" d="M655 133 V175"/>
<path class="line" d="M520 225 H485"/>
<path class="line" d="M285 225 H250"/>
<text class="label" x="30" y="306">02  NOTIFICAÇÃO · PROCESSAMENTO POSTERIOR</text>
<rect class="box" x="30" y="330" width="140" height="82"/><text class="text" x="100" y="362">Agendador</text><text class="small" x="100" y="386">worker</text>
<rect class="box strong" x="205" y="330" width="150" height="82"/><text class="text" x="280" y="362">PostgreSQL</text><text class="small" x="280" y="386">SKIP LOCKED</text>
<rect class="box" x="390" y="330" width="150" height="82"/><text class="text" x="465" y="362">Notificador</text><text class="small" x="465" y="386">HTTP externo</text>
<rect class="box" x="575" y="330" width="155" height="82"/><text class="text" x="652.5" y="362">Registrar</text><text class="small" x="652.5" y="386">SENT · retry · FAILED</text>
<path class="line" d="M170 371 H195"/>
<path class="line" d="M355 371 H380"/>
<path class="line" d="M540 371 H565"/>
<path class="branch" d="M652.5 412 V449 H280 V422"/>
<text class="label" x="417" y="443">atualização no banco</text>
<rect x="30" y="482" width="700" height="80" rx="10" fill="#0b1320" stroke="#1f3a5c"/>
<text class="small" x="380" y="506">Mesma chave e mesmos dados devolvem a transferência original; dados diferentes geram 409.</text>
<text class="small" x="380" y="528">Recusa do autorizador causa rollback; a chamada HTTP ocorre com as carteiras bloqueadas.</text>
<text class="small" x="380" y="550">Falhar ao notificar não desfaz a transferência: há novas tentativas até o limite (FAILED).</text>
</svg>
