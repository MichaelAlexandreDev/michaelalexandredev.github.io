<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline atual do Ayvu</title>
  <desc id="desc">O EPUB original é inspecionado e segmentado com preservação de marcação. Os textos passam por cache, memória e tradutor local, recebem glossário, são reconstruídos em novo EPUB e seguem para revisão e validação.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#70e1c1"/>
    </marker>
    <style>
      .box { fill: #151b22; stroke: #3a4653; stroke-width: 2; rx: 12; }
      .strong { fill: #11221f; stroke: #70e1c1; }
      .text { fill: #f5f7fa; font: 600 16px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #a9b2bd; font: 13px Arial, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #70e1c1; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #86b7ff; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box strong" x="25" y="55" width="145" height="78"/>
  <text class="text" x="97" y="87">EPUB original</text>
  <text class="small" x="97" y="110">somente leitura</text>

  <rect class="box" x="225" y="45" width="160" height="98"/>
  <text class="text" x="305" y="78">Inspeção</text>
  <text class="small" x="305" y="101">texto visível</text>
  <text class="small" x="305" y="121">markup protegido</text>

  <rect class="box" x="445" y="45" width="145" height="98"/>
  <text class="text" x="517" y="78">Cache + TM</text>
  <text class="small" x="517" y="101">match exato</text>
  <text class="small" x="517" y="121">similaridade</text>

  <rect class="box" x="625" y="55" width="110" height="78"/>
  <text class="text" x="680" y="87">Provider</text>
  <text class="small" x="680" y="110">HTTP local</text>

  <path class="line" d="M170 94 H215"/>
  <path class="line" d="M385 94 H435"/>
  <path class="line" d="M590 94 H615"/>

  <rect class="box" x="530" y="220" width="150" height="78"/>
  <text class="text" x="605" y="252">Glossário</text>
  <text class="small" x="605" y="275">termos controlados</text>
  <path class="line" d="M680 133 V180 Q680 210 650 210 H605 V210"/>

  <rect class="box strong" x="280" y="210" width="185" height="98"/>
  <text class="text" x="372" y="243">Reconstrução</text>
  <text class="small" x="372" y="266">HTML e recursos</text>
  <text class="small" x="372" y="286">novo arquivo EPUB</text>
  <path class="line" d="M530 259 H475"/>

  <rect class="box" x="30" y="210" width="180" height="98"/>
  <text class="text" x="120" y="243">Revisão CSV</text>
  <text class="small" x="120" y="266">exportar / aplicar</text>
  <text class="small" x="120" y="286">decisão humana</text>
  <path class="branch" d="M280 259 H220"/>

  <rect class="box strong" x="280" y="385" width="185" height="78"/>
  <text class="text" x="372" y="417">Validação final</text>
  <text class="small" x="372" y="440">links · imagens · capítulos</text>
  <path class="line" d="M372 308 V375"/>

  <path class="branch" d="M120 308 V424 H270"/>
  <text class="small" x="117" y="350">EPUB revisado</text>
</svg>
