<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Wallet API technical flow</title>
  <desc id="desc">A transfer request passes through external authorization, enters a PostgreSQL transaction with ordered locks, persists the payment and a pending notification, and is later processed with retries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#70e1c1"/>
    </marker>
    <style>
      .box { fill: #151b22; stroke: #3a4653; stroke-width: 2; rx: 12; }
      .strong { fill: #11221f; stroke: #70e1c1; }
      .text { fill: #f5f7fa; font: 600 17px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #a9b2bd; font: 14px Arial, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #70e1c1; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #86b7ff; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="30" y="55" width="160" height="78"/>
  <text class="text" x="110" y="88">POST /transfer</text>
  <text class="small" x="110" y="112">HTTP validation</text>

  <rect class="box" x="300" y="35" width="170" height="98"/>
  <text class="text" x="385" y="76">Authorization</text>
  <text class="small" x="385" y="100">timeout + fail closed</text>

  <rect class="box strong" x="565" y="45" width="165" height="98"/>
  <text class="text" x="647" y="79">Transaction</text>
  <text class="small" x="647" y="103">locks by lowest ID</text>
  <text class="small" x="647" y="123">debit + credit</text>

  <path class="line" d="M190 94 H290"/>
  <path class="line" d="M470 94 H555"/>

  <rect class="box strong" x="510" y="220" width="220" height="98"/>
  <text class="text" x="620" y="253">PostgreSQL</text>
  <text class="small" x="620" y="277">confirmed transfer</text>
  <text class="small" x="620" y="297">pending notification</text>
  <path class="line" d="M647 143 V210"/>

  <rect class="box" x="250" y="230" width="175" height="78"/>
  <text class="text" x="337" y="263">Worker</text>
  <text class="small" x="337" y="287">SKIP LOCKED</text>
  <path class="dash" d="M500 269 H435"/>

  <rect class="box" x="30" y="220" width="155" height="98"/>
  <text class="text" x="107" y="253">Notifier</text>
  <text class="small" x="107" y="277">external HTTP</text>
  <text class="small" x="107" y="297">retries</text>
  <path class="line" d="M250 269 H195"/>

  <rect x="30" y="370" width="700" height="56" rx="10" fill="#0d1518" stroke="#28443d"/>
  <text class="small" x="380" y="394">A notification failure does not undo an already confirmed transfer.</text>
  <text class="small" x="380" y="416">Pending state survives restarts and enables another attempt.</text>
</svg>
