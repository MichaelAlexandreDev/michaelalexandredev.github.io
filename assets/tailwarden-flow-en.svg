<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
  <title id="title">Tailwarden concurrent flow</title>
  <desc id="desc">The API validates filters, discovers regions, and distributes queries to a bounded worker pool. Each worker paginates Lambda functions and optionally retrieves tags. An aggregator sorts results and includes partial-failure warnings.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#70e1c1"/>
    </marker>
    <style>
      .box { fill: #151b22; stroke: #3a4653; stroke-width: 2; rx: 12; }
      .strong { fill: #11221f; stroke: #70e1c1; }
      .warn { fill: #171c22; stroke: #86b7ff; }
      .text { fill: #f5f7fa; font: 600 16px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #a9b2bd; font: 13px Arial, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #70e1c1; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #86b7ff; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="25" y="70" width="155" height="88"/>
  <text class="text" x="102" y="104">GET /functions</text>
  <text class="small" x="102" y="128">runtime · region · tags</text>

  <rect class="box" x="235" y="70" width="150" height="88"/>
  <text class="text" x="310" y="104">Discovery</text>
  <text class="small" x="310" y="128">enabled regions</text>
  <path class="line" d="M180 114 H225"/>

  <rect class="box strong" x="440" y="55" width="175" height="118"/>
  <text class="text" x="527" y="91">Worker pool</text>
  <text class="small" x="527" y="115">bounded concurrency</text>
  <text class="small" x="527" y="137">context cancellation</text>
  <text class="small" x="527" y="157">no unbounded fan-out</text>
  <path class="line" d="M385 114 H430"/>

  <rect class="box" x="570" y="250" width="165" height="88"/>
  <text class="text" x="652" y="284">AWS Lambda</text>
  <text class="small" x="652" y="308">pagination + tags</text>
  <path class="line" d="M565 173 Q565 215 620 215 Q652 215 652 240"/>

  <rect class="box strong" x="285" y="245" width="200" height="98"/>
  <text class="text" x="385" y="279">Aggregation</text>
  <text class="small" x="385" y="303">filtering + sorting</text>
  <text class="small" x="385" y="323">deterministic result</text>
  <path class="line" d="M570 294 H495"/>

  <rect class="box warn" x="25" y="245" width="190" height="98"/>
  <text class="text" x="120" y="279">Partial response</text>
  <text class="small" x="120" y="303">available functions</text>
  <text class="small" x="120" y="323">+ regional warnings</text>
  <path class="line" d="M285 294 H225"/>

  <path class="dash" d="M385 343 V415 H120 V353"/>
  <text class="small" x="385" y="438">If every region fails, the API returns an error instead of an empty success.</text>
</svg>
