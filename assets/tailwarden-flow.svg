<svg xmlns="http://www.w3.org/2000/svg" width="760" height="830" viewBox="0 0 760 830" role="img" aria-labelledby="tailwarden-flow-title tailwarden-flow-desc">
<title id="tailwarden-flow-title">Fluxo concorrente do Tailwarden</title><desc id="tailwarden-flow-desc">GET functions valida filtros. Com uma região informada, usa essa região diretamente; caso contrário, EC2 DescribeRegions descobre as regiões habilitadas. Workers regionais limitados paginam Lambda ListFunctions e aplicam o filtro de runtime. Se houver filtro de tags, um segundo pool limitado chama Lambda ListTags para as funções candidatas. Os resultados são agregados e ordenados. Falhas parciais viram avisos; falha ao listar regiões, falha total das regiões ou da leitura de tags candidatas retorna erro.</desc>
<defs>
  <marker id="tailwarden-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker>
  <marker id="tailwarden-flow-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5d6ff"/></marker>
  <style>
    .box { fill: #151b22; stroke: #3a4653; stroke-width: 2; rx: 12; }
    .strong { fill: #0f1d2e; stroke: #58a6ff; }
    .text { fill: #f5f7fa; font: 600 16px Arial, sans-serif; text-anchor: middle; }
    .small { fill: #a9b2bd; font: 13px Arial, sans-serif; text-anchor: middle; }
    .label { fill: #a5d6ff; font: 600 12px Arial, sans-serif; }
    .line { fill: none; stroke: #58a6ff; stroke-width: 2.5; marker-end: url(#tailwarden-flow-arrow); }
    .branch { fill: none; stroke: #a5d6ff; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#tailwarden-flow-blue-arrow); }
  </style>
</defs>
<text class="label" x="30" y="30">01  VARREDURA REGIONAL</text>
<rect class="box" x="30" y="55" width="165" height="78"/><text class="text" x="112.5" y="87">GET /functions</text><text class="small" x="112.5" y="111">runtime · região · tags</text>
<rect class="box" x="230" y="55" width="185" height="78"/><text class="text" x="322.5" y="87">Parse + validação</text><text class="small" x="322.5" y="111">filtros HTTP</text>
<rect class="box" x="500" y="55" width="200" height="78"/><text class="text" x="600" y="87">region informado?</text><text class="small" x="600" y="111">definir regiões</text>
<path class="line" d="M195 94 H220"/>
<path class="line" d="M415 94 H490"/>
<rect class="box" x="500" y="160" width="200" height="78"/><text class="text" x="600" y="192">EC2 DescribeRegions</text><text class="small" x="600" y="216">só sem filtro region</text>
<path class="line" d="M600 133 V150"/>
<text class="label" x="610" y="150">não</text>
<rect class="box strong" x="500" y="280" width="200" height="78"/><text class="text" x="600" y="312">Region workers</text><text class="small" x="600" y="336">concorrência limitada</text>
<path class="line" d="M600 238 V270"/>
<path class="branch" d="M700 94 H725 V319 H710"/>
<text class="label" x="702" y="80">sim</text>
<rect class="box" x="275" y="280" width="180" height="78"/><text class="text" x="365" y="312">Lambda ListFunctions</text><text class="small" x="365" y="336">paginação</text>
<rect class="box" x="30" y="280" width="200" height="78"/><text class="text" x="130" y="312">Filtro runtime</text><text class="small" x="130" y="336">funções candidatas</text>
<path class="line" d="M500 319 H465"/>
<path class="line" d="M275 319 H240"/>
<text class="label" x="148" y="393">02  FILTRO DE TAGS OPCIONAL</text>
<rect class="box" x="30" y="415" width="200" height="78"/><text class="text" x="130" y="447">tags informado?</text><text class="small" x="130" y="471">filtro opcional</text>
<rect class="box strong" x="275" y="415" width="180" height="78"/><text class="text" x="365" y="447">Tag workers</text><text class="small" x="365" y="471">limite separado</text>
<rect class="box" x="500" y="415" width="200" height="78"/><text class="text" x="600" y="447">Lambda ListTags</text><text class="small" x="600" y="471">por candidata</text>
<path class="line" d="M130 358 V405"/>
<path class="branch" d="M230 454 H265"/>
<path class="branch" d="M455 454 H490"/>
<rect class="box strong" x="275" y="545" width="200" height="78"/><text class="text" x="375" y="577">Agregar + ordenar</text><text class="small" x="375" y="601">ordem determinística</text>
<path class="branch" d="M130 493 V584 H265"/>
<text class="label" x="140" y="518">sem tags</text>
<path class="branch" d="M600 493 V584 H485"/>
<rect class="box" x="275" y="655" width="200" height="78"/><text class="text" x="375" y="687">200 · data + meta</text><text class="small" x="375" y="711">warnings se falha parcial</text>
<path class="line" d="M375 623 V645"/>
<rect x="30" y="752" width="700" height="58" rx="10" fill="#0b1320" stroke="#1f3a5c"/>
<text class="small" x="380" y="776">Algumas chamadas AWS falham: resultados saudáveis seguem com avisos.</text>
<text class="small" x="380" y="798">Falha ao listar regiões, todas as regiões falham ou nenhuma tag é lida: erro 502/504.</text>
</svg>
